[mca_commands]
	#If true, special vampire/hunter/werewolf AI reads MCA movement commands and avoids overriding explicit player orders.
	respectMcaPlayerCommands = true
	#If true, special villagers do not start autonomous combat while following a player through MCA commands.
	suppressAutonomousCombatWhileFollowing = true
	#If true, special villagers do not start autonomous combat while staying through MCA commands.
	suppressAutonomousCombatWhileStaying = true
	#If true, a following special villager may briefly retaliate against a nearby attacker.
	allowShortRetaliationWhileFollowing = true
	#If true, a staying special villager may briefly retaliate against a nearby attacker.
	allowShortRetaliationWhileStaying = false
	#Range: 0.0 ~ 64.0
	commandedRetaliationMaxDistance = 4.0
	#Range: 1 ~ 72000
	commandedRetaliationTicks = 100
	clearAutonomousTargetWhenCommanded = true
	#If true, MCA movement/work/home commands are accepted only from compatible factions.
	enableFactionCommandRestrictions = true
	showCommandBlockedMessage = true
	#If true, vampire/hunter/werewolf players may still command normal human MCA villagers.
	allowSpecialPlayersCommandHumans = true
	allowCommandsForInfectedHumans = true
	allowCommandsForCuringVillagers = false
	blockUnknownMcaCommandsForEnemyFactions = true

[guide_book]
	#Gives the Book of Occult Arts once when a player first enters an active vampire, hunter or werewolf-controlled village.
	giveOccultArtsBookOnSpecialVillageDiscovery = true

[village_missions]
	#If true, eligible residents of special villages can offer supplies or urgent aid through MCA conversations.
	enableOccultVillageMissions = true
	#Minimum time between village requests for the same player and totem. 24000 ticks is one Minecraft day.
	#Range: 1200 ~ 240000
	occultVillageMissionCooldownTicks = 24000
	#Time allowed to finish an accepted village request. 48000 ticks is two Minecraft days. Expired or canceled requests begin a new cooldown.
