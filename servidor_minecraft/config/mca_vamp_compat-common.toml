
[vampire]
	#Controls Sanguinare duration for MCA villagers infected by vampire players.
	#Range: 20 ~ 24000
	playerSanguinareDurationTicks = 24000
	#Controls Sanguinare duration for MCA villagers infected by MCA vampire villagers.
	#Range: 20 ~ 24000
	vampireVillagerSanguinareDurationTicks = 12000
	allowMcaVillagerInfection = true
	allowChildInfection = false
	#Range: 20 ~ 72000
	biteCooldownTicks = 6000
	#Range: 0.0 ~ 1.0
	nightAttackChance = 0.18
	#Chance that a valid vampire bite applies Sanguinare.
	#Range: 0.0 ~ 1.0
	conversionChanceOnBite = 0.65
	#If true, adult MCA vampire villagers use MCA's night schedule: they rest during the day and work at night.
	vampireVillagersUseNightSchedule = true
	#If true, MCA vampire villagers seek shade when exposed to daylight.
	vampireVillagersAvoidSun = true
	#If true, MCA vampire villagers take sunlight damage when exposed.
	vampireVillagersBurnInSun = false
	nonLethalBiteAgainstVillagers = true
	#Range: 0.0 ~ 40.0
	villagerBiteDamage = 0.0
	#Range: 20 ~ 72000
	recentlyBittenTargetCooldownTicks = 12000
	bloodDrainStopsCombat = true
	preventVampiresBitingVampires = true
	preventVampiresBitingMcaVampires = true
	showAlreadyVampireBiteMessage = true
	vampireVillagersInfectHumansAtNight = true
	vampireVillagersUseNonLethalBiteOnHumans = true
	#Range: 20 ~ 72000
	retaliationMemoryTicks = 2400
	attackOnlyTransformedWerewolves = true
	#Legacy option retained for existing TOMLs. Player melee attacks are never classified as bites.
	vampirePlayerBiteDealsDamageToMcaVillagers = false
	#Range: 0.0 ~ 40.0
	vampirePlayerBiteDamageToMcaVillagers = 0.0
	#If true, MCA vampire villagers can be safely cured without replacing their VillagerEntityMCA entity.
	enableMcaVampireVillagerCure = true
	#If true, giving milk to an infected, not-yet-converted MCA villager removes Sanguinare and stops conversion.
	allowMilkToTreatMcaVillagerSanguinare = true
	milkTreatmentRemovesNegativeEffects = true
	milkTreatmentConsumesMilk = true
	milkTreatmentReturnsBucket = true
	#If true, milk only treats infection before conversion and does not cure converted vampire villagers.
	milkTreatmentOnlyBeforeConversion = true
	vampireCureRequiresWeakness = true
	vampireCureRequiresGoldenApple = true
	vampireCureRequiresGarlicInjection = true
	#Weakness 4:00 is 4800 ticks. Direct potion use accepts a valid long weakness potion and saves short progress.
	#Range: 20 ~ 72000
	vampireCureRequiredWeaknessDurationTicks = 4800
	vampireCureAllowAnyWeaknessDuration = false
	#Range: 20 ~ 72000
	vampireCureIngredientProgressExpiresTicks = 6000
	#Range: 20 ~ 72000
	vampireCureDurationTicks = 3600
	vampireCureVillagerCannotAttack = true
	vampireCureVillagerCannotTrade = true
	vampireCureShowsParticles = true
	vampireCureAppliesWeaknessDuringProcess = true
	#Ticks after a completed cure where stale trait/appearance markers cannot restore vampire or werewolf state.
	#Range: 20 ~ 72000
	postCureResyncBlockTicks = 400
	#Range: 0.0 ~ 1.0
	twoVampireParentsInheritanceChance = 1.0
	#Range: 0.0 ~ 1.0
	oneVampireParentInheritanceChance = 0.45
	#Range: 1.0 ~ 10.0
	vampireBabyGrowthMultiplier = 1.5
	#Range: 20 ~ 24000
	growthProcessIntervalTicks = 1200
	allowVampireChildrenGrowthBoost = true
	enablePersistentVampireAppearance = true
	paleSkinEnabled = true
	preserveOriginalAppearanceForCure = true
	#Master toggle for client-side vampire eye visuals on MCA vampire villagers.
	vampireEyesEnabled = true

[balance]
	#Release-balanced vampire attribute modifiers. Defaults keep special villagers only lightly stronger than normal MCA villagers.
	#Range: 1.0 ~ 10.0
	maxHealthMultiplier = 1.2
	#Range: 0.0 ~ 100.0
	attackDamageBonus = 1.0
	#Range: 0.0 ~ 30.0
	armorBonus = 2.0
	#Range: 0.0 ~ 128.0
	followRangeBonus = 4.0
	applyCombatAttributesOnlyToAdults = true
	#Movement speed multipliers affect normal movement. Keep these close to 1.0 so MCA routines such as work/home/follow still feel natural.
	#Range: 0.05 ~ 3.0
	vampireVillagerMovementSpeedMultiplier = 1.0
	#Range: 0.05 ~ 3.0
	hunterVillagerMovementSpeedMultiplier = 1.0
	#Range: 0.05 ~ 3.0
	werewolfVillagerMovementSpeedMultiplier = 1.02
	#Range: 0.05 ~ 3.0
	defensiveVillagerMovementSpeedMultiplier = 1.0
	#Range: 0.05 ~ 1.0
	curingVillagerMovementSpeedMultiplier = 0.35
	#Combat movement speeds are used only by special combat/bite goals, not by normal MCA work/home/follow navigation. High values can make villagers look jittery.
	#Range: 0.1 ~ 3.0
	specialVillagerMaxNavigationSpeed = 0.75
	#Range: 0.1 ~ 3.0
	specialVillagerMeleeGoalSpeed = 0.65
	#Range: 0.1 ~ 3.0
	specialVillagerChaseGoalSpeed = 0.7
	#Range: 5 ~ 72000
	specialVillagerTargetScanIntervalTicks = 40
	#Range: 20 ~ 72000
	specialVillagerRetaliationMemoryTicks = 600
	#Range: 4 ~ 256
	specialVillagerMaxChaseDistance = 20
	#Range: 1 ~ 72000
	specialVillagerAttackCooldownTicks = 35
	#Minimum ticks between combat path recalculations. Higher values reduce jitter but make chases less reactive.
	#Range: 1 ~ 100
	specialVillagerCombatRepathIntervalTicks = 10
	#If true, MCA special villagers may automatically target non-MCA faction NPCs/mobs from Vampirism/Werewolves. If false, automatic targeting stays focused on MCA special villagers and enemy players. Retaliation against an NPC attacker is still allowed.
	specialVillagersTargetFactionNpcs = false

[factions]
	#Penalty applied to positive social interactions with MCA vampire villagers when the player is human.
	#Range: 0.0 ~ 1.0
	humanSocialPenalty = 0.1
	#Penalty applied to positive social interactions with MCA vampire villagers when the player is a werewolf or transformed werewolf.
	#Range: 0.0 ~ 1.0
	werewolfSocialPenalty = 0.25
	#Penalty applied to positive social interactions with MCA vampire villagers when the player is a hunter.
	#Range: 0.0 ~ 1.0
	hunterSocialPenalty = 0.35
	#If true, transformed werewolves cannot perform romantic or marriage interactions with MCA vampire villagers.
	blockWerewolfInteractions = true
	#If true, hunters cannot perform romantic or marriage interactions with MCA vampire villagers.
	blockHunterInteractions = true
	#Active. Used by the per-player wrapper trade price calculator. Real villager offers are not permanently modified.
	#Range: 1.0 ~ 10.0
	humanTradePriceMultiplier = 1.25
	#If true, transformed werewolves cannot trade with MCA vampire villagers. If false, they can trade using werewolfTradePriceMultiplier.
	blockWerewolfTrading = true
	#If true, hunters cannot trade with MCA vampire villagers. If false, they can trade using hunterTradePriceMultiplier.
	blockHunterTrading = true
	vampireVillagersTradeOnlyWithVampires = false
	#When safe API is unavailable, this is handled by the addon price bridge instead of editing MCA/vanilla reputation.
	clearVampireBiteReputationPenaltyOnConversion = true
	neutralizeConversionBitePenaltyForVampires = true
	#Range: 0.0 ~ 0.95
	vampirePlayerTradeDiscount = 0.15
	#Range: 1.0 ~ 10.0
	hunterTradePriceMultiplier = 2.0
	#Range: 1.0 ~ 10.0
	werewolfTradePriceMultiplier = 1.75
	vampireVillagersTreatVampiresAsAllies = true
	vampireVillagersTreatHuntersAsEnemies = true
	vampireVillagersTreatTransformedWerewolvesAsEnemies = true
	#If true, MCA vampire villager commerce/social logic treats disguised vampire players as HUMAN_DISGUISED.
	respectVampireDisguiseForMcaInteractions = true
	#If true, disguised vampire players do not receive the vampire ally trade discount.
	vampireDisguiseSuppressesVampireTradeDiscount = true
	#If true, disguised vampire players use the human social penalty for MCA vampire villagers.
	vampireDisguiseUsesHumanSocialPenalty = true
	#If true, Vampirism's infect action uses 100% conversion chance for MCA villagers.
	infectiousBiteOverridesConversionChance = true
	#If true, Vampirism's infect action uses playerSanguinareDurationTicks for MCA villagers.
	infectiousBiteStillUsesConfiguredDuration = true

[monster_behavior]
	#Legacy vampire-specific alias. The active monster-ignore system also has special-villager options below.
	monstersIgnoreMcaVampireVillagers = true
	#Legacy vampire-specific alias. The active monster-damage protection also has special-villager options below.
	cancelMonsterDamageToMcaVampireVillagers = true
	#Legacy vampire-specific alias. The active panic suppression also has special-villager options below.
	suppressMcaVampireVillagerZombiePanic = true
	#If true, suppresses MCA fear/surprised voice reactions for vampire villagers near common monsters.
	suppressMcaVampireVillagerFearDialogue = true
	#If true, common hostile monsters ignore MCA vampire, hunter, werewolf and curing villagers. Human MCA villagers remain normal targets.
	monstersIgnoreSpecialMcaVillagers = true
	#If true, special MCA villagers clear common monster targets and do not fight/flee as normal humans.
	specialMcaVillagersIgnoreCommonMonsters = true
	#If true, MCA vampire/hunter/werewolf/curing villagers suppress MCA panic memories caused by common monsters.
	suppressSpecialMcaVillagerMonsterPanic = true
	#If true, suppresses MCA fear/surprised voice reactions for special MCA villagers near common monsters.
	suppressSpecialMcaVillagerFearDialogue = true
	#Fallback protection: cancels damage from common hostile monsters to special MCA villagers.
	cancelMonsterDamageToSpecialMcaVillagers = true
	#If true, Sanguinare/Lupus infected MCA villagers count as special for monster ignore before conversion. Default false: they still look human.
	infectedMcaVillagersCountAsSpecialForMonsterIgnore = false
	#If true, MCA guards that are vampire, hunter, werewolf or defensive villagers may still defend the village against common hostile mobs.
	specialMcaGuardsDefendAgainstHostileMobs = true
	#If true, special MCA guards can fight common hostile mobs while panic/flee/surprised behavior remains suppressed.
	specialMcaGuardsStillSuppressPanic = true
	#If true, special MCA guards may auto-target creepers. Default false avoids guards chasing creepers into villages.
	specialMcaGuardsAttackCreepers = false

[advanced]
	#If true, MCA vampire villagers are protected from being replaced by aggressive villager entities from other mods.
	preventAggressiveVillagerReplacementForMcaVampires = true
	#If true, all MCA villagers are protected from aggressive-villager replacement. The addon replaces that dangerous swap with safe defensive mode for human MCA villagers.
	preventAggressiveVillagerReplacementForAllMcaVillagers = true
	enableMcaVampireTrait = true
	enableMcaWerewolfTrait = true
	syncTraitAndCapabilityOnLoad = true
	#Migrates the Forge 1.20.1 capability payload from existing MCA villagers on first load.
	enableLegacy103Migration = true
	traitCanRestoreCapability = true
	vampireTraitControlsInheritance = true
	#Range: 0.0 ~ 1.0
	oneVampireParentTraitInheritanceChance = 0.45
	#Range: 0.0 ~ 1.0
	twoVampireParentsTraitInheritanceChance = 1.0

[hunter]
