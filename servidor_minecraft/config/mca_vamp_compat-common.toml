	#If true, vampire fog and compat-owned special-village effects follow the editable MCA village bounds when the totem is inside that village. Vampirism capture, raids and spawning stay native.
	mcaVillageEffectsFollowMcaBounds = true
	#Horizontal fog-only margin beyond an MCA village border. 0 ends fog at the final MCA village block; Hunter control, book discovery and outlines remain on the exact MCA border.
	#Range: 0 ~ 64
	mcaVillageFogBorderMarginBlocks = 4

[dialogues]
	#If true, short faction-themed lines accompany existing MCA conversations, faction refusals and cure milestones. These lines never change gameplay outcomes.
	enableFactionContextualDialogues = true

[gifts]
	#If true, Vampire, Hunter and Werewolf villagers use their faction-specific gift tastes. Gifts still use MCA's native saturation and relationship rules.
	enableFactionGiftPreferences = true
	#If true, Vampire and Werewolf villagers use their faction-specific recovery diets. Humans and Hunters keep MCA's normal recovery food.
	enableFactionRecoveryDiet = true

[debug]
	#Enables compact diagnostic logs for trade, faction, bite, state and Easy Villagers integration.
	enableDebugLogs = false
	#Very verbose AI target-candidate diagnostics. Normal debug logs still include selected/dropped targets, attacks and retaliation.
	enableVerboseAiDebugLogs = false
	#Deep Easy Villagers stored-villager NBT diagnostics. Very verbose; only enable when diagnosing NBT persistence issues.
	enableVerboseNbtDebugLogs = false

