	#Range: 0.0 ~ 1024.0
	haloExtraHealthTermMultiplier = 1.0
	#Base armor added by halos (before tier scaling). Default: 5
	#Range: 0.0 ~ 1024.0
	haloExtraArmorBase = 5.0
