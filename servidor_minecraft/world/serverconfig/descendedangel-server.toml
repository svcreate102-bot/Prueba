	#Range: 0.0 ~ 1024.0
	haloExtraArmorTermMultiplier = 1.0
	#Global multiplier for all halo stat bonuses. < 1.0 = weaker halos, > 1.0 = stronger.
	#Range: 0.0 ~ 100.0
	haloEffectivenessMultiplier = 1.0

